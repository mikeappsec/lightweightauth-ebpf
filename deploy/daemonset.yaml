---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lwauth-ebpf
  namespace: lwauth-system
  labels:
    app.kubernetes.io/name: lwauth-ebpf
    app.kubernetes.io/component: ebpf-dataplane
    app.kubernetes.io/part-of: lightweightauth
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lwauth-ebpf
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lwauth-ebpf
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9191"
        prometheus.io/path: "/metrics"
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: lwauth-ebpf
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      containers:
        - name: lwauth-ebpf
          image: ghcr.io/mikeappsec/lwauth-ebpf:latest
          args:
            - --config=/etc/lwauth-ebpf/config.yaml
            - --metrics-addr=:9191
          securityContext:
            privileged: true
            capabilities:
              add:
                - BPF
                - SYS_ADMIN
                - NET_ADMIN
                - PERFMON
          volumeMounts:
            - name: config
              mountPath: /etc/lwauth-ebpf
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
            - name: bpf-fs
              mountPath: /sys/fs/bpf
            - name: lwauth-sock
              mountPath: /run/lwauth
          ports:
            - containerPort: 9191
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: lwauth-ebpf-config
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpf-fs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: lwauth-sock
          hostPath:
            path: /run/lwauth
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lwauth-ebpf
  namespace: lwauth-system
  labels:
    app.kubernetes.io/name: lwauth-ebpf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lwauth-ebpf-config
  namespace: lwauth-system
data:
  config.yaml: |
    bpfDir: /opt/lwauth-ebpf/bpf
    cgroupPath: /sys/fs/cgroup
    lwauthSocket: /run/lwauth/lwauth.sock
    failMode: open
    interceptPorts:
      - lo: 80
        hi: 80
      - lo: 443
        hi: 443
      - lo: 8080
        hi: 8090
    denyCidrs: []
